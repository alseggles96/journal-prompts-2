<!DOCTYPE html>
<html>
<head>
    <title>Journal Prompt Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="box">
        <h1>Welcome to your daily diary!</h1>
        <h2>Grow Closer to Yourself with Every Entry</h2>
        <p id="prompt">Click the button to get the words flowing!</p>
        <button onclick="generatePrompt()">New Prompt</button>
        <textarea id="journal" placeholder="Pour your heart out here..."></textarea>
        <button onclick="saveEntry()">Save Entry</button>
        <div id="history">
            <h3>Your Journal History</h3>
            <ul id="history-list"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html
